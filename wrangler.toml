# OpenNext Cloudflare configuration
name = "onopo-app"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
# worker.ts wraps .open-next/worker.js and adds the cron (scheduled) handler
main = "worker.ts"
# Served only on onopostore.com / www (custom domains and routes are managed in the Cloudflare dashboard).
# No public <name>.<account>.workers.dev URL and no version/preview URLs: they would serve the live store
# (and its D1/R2) on another host, outside the canonical-host and HSTS rules. Nothing in the repo uses them.
workers_dev = false
preview_urls = false

# Assets configuration
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "onopo-db"
database_id = "750bb90b-a48c-4e9f-9c21-88e8a5e2e313"

# R2 Bucket binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "onopo-storage"

# No Workers AI binding since 2026-11-21 (owner): every assistant model runs on Runware with the RUNWARE_API_KEY
# secret (lib/assistant/ai-provider.ts). A local `wrangler dev` needs RUNWARE_API_KEY in .dev.vars for the assistant.

# Cloudflare Images binding: resized WebP variants (v/<w>/<key>.webp) made on the server after admin uploads and
# by the daily cron (lib/image-variants-auto.ts). Billed per unique transformation per month; 5,000 free on the
# Images Free plan (over it new transformations fail with 9422, nothing is charged).
[images]
binding = "IMAGES"

# AI assistant throttles (Workers Rate Limiting; counted per Cloudflare location, approximate)
[[ratelimits]]
name = "CHAT_RL_BURST"
namespace_id = "3101"
simple = { limit = 3, period = 10 }

[[ratelimits]]
name = "CHAT_RL_MIN"
namespace_id = "3102"
simple = { limit = 8, period = 60 }

# Keeps DeepSeek under its 20 requests/min account limit (key "deepseek"); over it the fallback model answers
[[ratelimits]]
name = "CHAT_RL_MODEL"
namespace_id = "3103"
simple = { limit = 18, period = 60 }

# Review link POSTs (/api/reviews/order/, key "review:<ip>"); the signed token is the real gate
[[ratelimits]]
name = "REVIEW_RL"
namespace_id = "3104"
simple = { limit = 10, period = 60 }

# Environment Variables
[vars]
NEXT_PUBLIC_BASE_URL = "https://onopostore.com"
R2_ENDPOINT = "https://3c39c225b3a27de7822833feb24b65b1.r2.cloudflarestorage.com"
R2_BUCKET_NAME = "onopo-storage"
CLOUDFLARE_ACCOUNT_ID = "3c39c225b3a27de7822833feb24b65b1"
# Assistant models: Runware AIR ids (provider:model@version), all need the RUNWARE_API_KEY secret
# (lib/assistant/ai-provider.ts). Chat = DeepSeek V4.1 Flash; router = a small fast model answering the router
# questions as JSON (lib/assistant/router.ts); fallback = the older DeepSeek V4 Flash when the main one is busy.
AI_CHAT_MODEL = "deepseek:v4.1@flash-1017"
AI_ROUTER_MODEL = "google:gemini@3.5-flash-lite"
AI_FALLBACK_MODEL = "deepseek:v4@flash"
# Workers AI only (unused on Runware). Set to an AI Gateway id (created in the dashboard with logs OFF) to get gateway analytics/spend limits; empty = no gateway
AI_GATEWAY_ID = ""
# IndexNow key (lib/indexnow.ts). Public by design: worker.ts serves it at https://onopostore.com/<key>.txt so Bing,
# Yandex & co. can verify submissions. Changing it only means the engines verify the new file. Empty = IndexNow off.
INDEXNOW_KEY = "0f7a3bf951e623b67e1fcecbe80d3025"

# Secrets (add via: npx wrangler secret put R2_ACCESS_KEY_ID)
# R2_ACCESS_KEY_ID
# R2_SECRET_ACCESS_KEY
# RUNWARE_API_KEY
# RESEND_API_KEY
# JWT_SECRET
# CRON_SECRET (used by the scheduled handler in worker.ts)

# Smart Placement - Run workers closer to backend for better performance
[placement]
mode = "smart"

# Observability
[observability]
enabled = true

# Cron Triggers - Daily price update at 10:00 AM Turkey time (UTC+3 = 07:00 UTC)
[triggers]
crons = ["0 7 * * *"]

